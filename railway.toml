[build]
builder = "NIXPACKS"
buildCommand = "npm install"

[deploy]
startCommand = "node backend-server.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[services]]
name = "biochar-api"

[services.variables]
NODE_ENV = "production"
PORT = "3000"
